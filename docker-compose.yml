services:
  cheat-clip-pro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cheat-clip-pro
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SUPADATA_API_KEYS=${SUPADATA_API_KEYS:-}
      - WEBSHARE_PROXY=${WEBSHARE_PROXY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - JOB_DATABASE_PATH=/app/backend/data/jobs.sqlite3
      - UPLOAD_MAX_AGE_SECONDS=${UPLOAD_MAX_AGE_SECONDS:-86400}
      - EXPORT_MAX_AGE_SECONDS=${EXPORT_MAX_AGE_SECONDS:-604800}
    volumes:
      - media_temp:/app/backend/temp_clips
      - media_uploads:/app/backend/temp_clips/uploads
      - media_exports:/app/backend/exports
      - custom_fonts:/app/backend/fonts
      - render_jobs:/app/backend/data
    deploy:
      resources:
        limits:
          memory: 3200M

volumes:
  media_temp:
  media_uploads:
  media_exports:
  custom_fonts:
  render_jobs:
